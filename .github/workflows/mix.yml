name: Mix Collect
on:
  schedule:
    - cron: '7 * * * *'   # 매시간 7분
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 발전원별 발전량 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_mix.py
      - name: 변경 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add power_mix.json
          git diff --staged --quiet || (git commit -m "발전원별 발전량 갱신" && git pull --rebase && git push)
