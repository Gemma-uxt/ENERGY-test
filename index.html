<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에너지 시장정보 - 환율</title>
<style>
:root{--ink:#1b2a41;--mut:#66758a;--line:#dde5ef;--bg:#f5f8fc;--acc:#2f6fb3;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:40px 20px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 24px}
.list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 22px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-size:16px}
.name small{display:block;color:var(--mut);font-size:13px}
.val{font-size:26px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.val small{font-size:14px;font-weight:400;color:var(--mut);margin-left:4px}
.msg{padding:24px;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>환율</h1>
  <p class="sub" id="sub">불러오는 중…</p>
  <div class="list" id="list"><div class="msg">데이터를 불러오는 중입니다.</div></div>
</main>
<script>
var NAMES = {"USD":["미국 달러","USD 1달러"],"JPY(100)":["일본 엔","JPY 100엔"],"EUR":["유로","EUR 1유로"],"CNH":["중국 위안","CNH 1위안"]};
fetch("indicators.json?t=" + Date.now())
  .then(function(r){ if(!r.ok) throw new Error("파일 없음"); return r.json(); })
  .then(function(d){
    var fx = d.fx, d8 = fx.date;
    document.getElementById("sub").textContent =
      "기준일 " + d8.slice(0,4) + "-" + d8.slice(4,6) + "-" + d8.slice(6) + " · 수집 " + d.updated_at + " · 출처 한국수출입은행";
    var html = "";
    Object.keys(NAMES).forEach(function(k){
      if (!fx.rates[k]) return;
      html += '<div class="row"><div class="name">' + NAMES[k][0] + '<small>' + NAMES[k][1] +
              '</small></div><div class="val">' + fx.rates[k] + '<small>원</small></div></div>';
    });
    document.getElementById("list").innerHTML = html || '<div class="msg">표시할 데이터가 없습니다.</div>';
  })
  .catch(function(){
    document.getElementById("sub").textContent = "";
    document.getElementById("list").innerHTML = '<div class="msg">indicators.json을 찾을 수 없습니다. 자동 수집을 한 번 실행해 주세요.</div>';
  });
</script>
</body>
</html>
